name: rgon-cli

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub release (tag cli-v<headless/VERSION>)'
        type: boolean
        default: false
  push:
    branches:
      - '**'
    paths:
      - 'headless/**'
      - 'src/**'
      - 'shared/**'
      - 'include/**'
      - 'patch/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/rgon-cli.yml'
  pull_request:
    paths:
      - 'headless/**'
      - 'src/**'
      - 'shared/**'
      - 'include/**'
      - 'patch/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/rgon-cli.yml'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      # wxWidgets is not needed for the headless build.
      - name: Checkout submodules
        run: git submodule update --init --depth 1 deps/curl deps/zlib deps/inih deps/rapidjson deps/libzip

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content headless/VERSION -Raw).Trim()
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure
        run: cmake -A Win32 -B build -DLAUNCHER_BUILD_GUI=OFF

      - name: Build
        run: cmake --build build --config Release --target rgon-cli

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --component rgon-cli --prefix dist/rgon-cli
          Get-ChildItem -Recurse dist/rgon-cli | Select-Object FullName, Length | Format-Table -AutoSize
          Compress-Archive -Path dist/rgon-cli/* -DestinationPath dist/rgon-cli.zip
          $hash = (Get-FileHash dist/rgon-cli.zip -Algorithm SHA256).Hash.ToLower()
          [System.IO.File]::WriteAllText("$PWD/dist/rgon-cli.zip.sha256", $hash)

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path dist/rgon-cli/rgon-cli.exe

          function Invoke-Cli([string[]] $arguments, [string] $output) {
            $process = Start-Process -FilePath $exe -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $output
            Get-Content $output | Out-Host
            return @{
              ExitCode = $process.ExitCode
              Result = Get-Content $output | Select-Object -Last 1 | ConvertFrom-Json
            }
          }

          # The loader routine copied into the game lives in its own section.
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $sectionCount = [BitConverter]::ToUInt16($bytes, $pe + 6)
          $optionalHeaderSize = [BitConverter]::ToUInt16($bytes, $pe + 20)
          $sections = for ($i = 0; $i -lt $sectionCount; $i++) {
            $offset = $pe + 24 + $optionalHeaderSize + 40 * $i
            [System.Text.Encoding]::ASCII.GetString($bytes, $offset, 8).TrimEnd([char]0)
          }
          Write-Host "Sections: $($sections -join ', ')"
          if ($sections -notcontains '.trampo') { throw ".trampo section missing" }

          $version = Invoke-Cli @('version') dist/version.txt
          if ($version.ExitCode -ne 0 -or -not $version.Result.ok -or
              $version.Result.cliVersion -ne '${{ steps.version.outputs.version }}') {
            throw "unexpected version output"
          }

          # No game on the runner: exercises argument parsing and installation checks.
          $status = Invoke-Cli @('status', '--isaac', 'C:\no-isaac-here') dist/status.txt
          if ($status.ExitCode -ne 1 -or $status.Result.error -ne 'invalid_isaac') {
            throw "unexpected status output"
          }

          $usage = Invoke-Cli @('launch', '--launch-mode', 'unknown') dist/usage.txt
          if ($usage.ExitCode -ne 2 -or $usage.Result.error -ne 'usage') {
            throw "unexpected usage output"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: rgon-cli-${{ steps.version.outputs.version }}
          path: |
            dist/rgon-cli.zip
            dist/rgon-cli.zip.sha256

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cli-v${{ steps.version.outputs.version }}
          name: rgon-cli ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/rgon-cli.zip
            dist/rgon-cli.zip.sha256
